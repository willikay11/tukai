<!--
Source: Tukai Web.dc.html (design project folder), the Moments view's listing
(the tabMoments block). Markup and inline values kept, scripts removed.
Template tokens are left as the prototype has them. Re-extract when the prototype changes.
-->
<sc-if value="{{ tabMoments }}">
          <div style="padding-top:30px;">
            <div style="min-width:0;">
              <h2 style="margin:0;font-family:'Google Sans';font-size:22px;font-weight:700;color:#013334;letter-spacing:-.3px;">Moments</h2>
              
            </div>
            
            <sc-if value="{{ mFeedEmpty }}"><p style="margin:20px 0 0;font-size:14.5px;line-height:1.5;color:#3C4A45;text-wrap:pretty;">{{ mEmptyLine }}</p></sc-if>
            <div data-mfeed="1" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:30px 20px;align-items:start;margin-top:22px;">
                  <sc-for list="{{ mFeed }}" as="m" hint-placeholder-count="10">
                  <sc-if value="{{ m.isCard }}" hint-placeholder-val="{{ true }}">
                    <article style="display:flex;flex-direction:column;gap:10px;min-width:0;">
                      <button type="button" onClick="{{ m.onOpen }}" aria-label="{{ m.aria }}" style="position:relative;display:block;width:100%;aspect-ratio:3 / 4;padding:0;border:none;border-radius:12px;overflow:hidden;background:#F3F4F2;cursor:pointer;">
                        <sc-if value="{{ m.isSingle }}" hint-placeholder-val="{{ true }}"><img src="{{ m.coverImg }}" alt="{{ m.alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease;" style-hover="transform:scale(1.04);"></sc-if><sc-if value="{{ m.isAlbum }}"><span style="position:absolute;inset:0;display:block;">{{ m.cover }}</span></sc-if>
                        <sc-if value="{{ m.isAlbum }}">
                          <span aria-hidden="true" style="position:absolute;right:10px;bottom:10px;width:66px;height:42px;pointer-events:none;">
                            <sc-if value="{{ m.hasFanA }}"><img loading="lazy" src="{{ m.fanA }}" alt="" style="position:absolute;left:0;bottom:1px;width:30px;height:32px;border-radius:7px;border:2px solid #FFFFFF;object-fit:cover;display:block;background:#F3F4F2;box-shadow:0 2px 7px rgba(0,0,0,.3);transform:rotate(-14deg);"></sc-if>
                            <sc-if value="{{ m.hasFanC }}"><img loading="lazy" src="{{ m.fanC }}" alt="" style="position:absolute;right:0;bottom:1px;width:30px;height:32px;border-radius:7px;border:2px solid #FFFFFF;object-fit:cover;display:block;background:#F3F4F2;box-shadow:0 2px 7px rgba(0,0,0,.3);transform:rotate(14deg);"></sc-if>
                            <sc-if value="{{ m.hasFanB }}"><span style="position:absolute;left:16px;bottom:3px;width:34px;height:36px;border-radius:8px;border:2px solid #FFFFFF;overflow:hidden;background:#F3F4F2;box-shadow:0 2px 7px rgba(0,0,0,.3);"><img loading="lazy" src="{{ m.fanB }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;"><sc-if value="{{ m.hasFanMore }}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(1,26,27,.55);color:#FFFFFF;font-size:11px;font-weight:700;">{{ m.fanMore }}</span></sc-if></span></sc-if>
                          </span>
                        </sc-if>
                        <span style="position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;font-size:12px;font-weight:600;pointer-events:none;">
                          <i class="hgi-twotone {{ m.parentIcon }}" style="font-size:14px;flex:0 0 auto;" aria-hidden="true"></i>
                          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ m.parentLabel }}</span>
                        </span>
                        <sc-if value="{{ m.isNew }}"><span style="position:absolute;right:10px;top:10px;height:24px;padding:0 9px;border-radius:999px;background:#B0E800;color:#013334;font-size:11px;font-weight:700;display:inline-flex;align-items:center;pointer-events:none;">Yours</span></sc-if>
                      </button>
                      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                        <img loading="lazy" src="{{ m.authorImg }}" alt="" style="width:34px;height:34px;border-radius:999px;object-fit:cover;display:block;flex:0 0 auto;background:#E8F1ED;">
                        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;">
                          <span style="font-size:14px;font-weight:600;color:#013334;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ m.author }}</span>
                          <span style="font-size:12.5px;color:#5B6B66;">{{ m.date }}</span>
                        </span>
                      </div>
                      <sc-if value="{{ m.capShut }}" hint-placeholder-val="{{ true }}"><div style="position:relative;min-width:0;"><p data-mcap="{{ m.capKey }}" style="margin:0;font-size:14px;line-height:1.5;color:#1F2937;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ m.caption }}</p><sc-if value="{{ m.capToggle }}"><button type="button" onClick="{{ m.onCapToggle }}" aria-expanded="false" style="position:absolute;right:0;bottom:0;height:21px;padding:0 0 0 28px;border:none;background:linear-gradient(90deg,rgba(255,255,255,0) 0,#FFFFFF 24px);color:#066349;font-family:'Google Sans';font-size:14px;line-height:21px;font-weight:600;cursor:pointer;white-space:nowrap;" style-before="content:'';position:absolute;inset:-12px -6px -12px 12px;" style-hover="color:#044B36;">See more</button></sc-if></div></sc-if>
                      <sc-if value="{{ m.capOpen }}"><p style="margin:0;font-size:14px;line-height:1.5;color:#1F2937;text-wrap:pretty;">{{ m.caption }} <button type="button" onClick="{{ m.onCapToggle }}" aria-expanded="true" style="position:relative;display:inline;padding:0;border:none;background:transparent;color:#066349;font-family:'Google Sans';font-size:14px;line-height:1.5;font-weight:600;cursor:pointer;white-space:nowrap;" style-before="content:'';position:absolute;inset:-12px -6px;" style-hover="color:#044B36;">See less</button></p></sc-if>
                    </article></sc-if>
                  <sc-if value="{{ m.isBreak }}">
                    <section aria-label="{{ m.title }}" style="grid-column:1 / -1;min-width:0;padding:10px 0 12px;">
                      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
                        <div style="min-width:0;">
                          <h2 style="margin:0;font-family:'Google Sans';font-size:22px;font-weight:700;color:#013334;letter-spacing:-.3px;">{{ m.title }}</h2>
                          <p style="margin:5px 0 0;font-size:13.5px;color:#5B6B66;">{{ m.sub }}</p>
                        </div>
                        <sc-if value="{{ m.nav.show }}">
                  <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
                    <button type="button" disabled="{{ m.nav.backOff }}" onClick="{{ m.nav.back }}" aria-label="Previous {{ m.noun }}" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ m.nav.backBc }};border-radius:999px;background:{{ m.nav.backBg }};display:flex;align-items:center;justify-content:center;cursor:{{ m.nav.backCur }};pointer-events:{{ m.nav.backPe }};opacity:{{ m.nav.backOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                      <i class="hgi-twotone hgi-arrow-left-01" style="font-size:14px;flex:0 0 auto;color:{{ m.nav.backFg }};" aria-hidden="true"></i>
                    </button>
                    <button type="button" disabled="{{ m.nav.nextOff }}" onClick="{{ m.nav.next }}" aria-label="Next {{ m.noun }}" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ m.nav.nextBc }};border-radius:999px;background:{{ m.nav.nextBg }};display:flex;align-items:center;justify-content:center;cursor:{{ m.nav.nextCur }};pointer-events:{{ m.nav.nextPe }};opacity:{{ m.nav.nextOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                      <i class="hgi-twotone hgi-arrow-right-01" style="font-size:14px;flex:0 0 auto;color:{{ m.nav.nextFg }};" aria-hidden="true"></i>
                    </button>
                  </div>
                </sc-if>
                      </div>
                      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px 16px;margin-top:18px;">
                        <sc-for list="{{ m.items }}" as="n" hint-placeholder-count="8">
                          <button type="button" onClick="{{ n.onOpen }}" style="display:flex;align-items:center;gap:14px;min-width:0;padding:10px 14px 10px 10px;border:none;border-radius:12px;background:#FFFFFF;text-align:left;cursor:pointer;font-family:'Google Sans';" style-hover="box-shadow:0 8px 24px rgba(1,51,52,.08);" style-active="transform:scale(0.99);">
                            <img src="{{ n.img }}" alt="" loading="lazy" style="width:72px;height:72px;border-radius:8px;object-fit:cover;flex:0 0 auto;display:block;background:#F3F4F2;filter:{{ n.imgFilter }};">
                            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;">
                              <span style="font-size:14.5px;font-weight:600;color:#013334;line-height:1.3;">{{ n.name }}</span>
                              <span style="font-size:12.5px;color:#5B6B66;line-height:1.35;">{{ n.kindLine }}</span>
                              <span style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;font-weight:600;">
                                <span style="display:inline-flex;align-items:center;gap:5px;color:{{ n.metaColor }};">
                                  <i class="hgi-twotone {{ n.metaIcon }}" style="font-size:14px;flex:0 0 auto;" aria-hidden="true"></i>
                                  {{ n.meta }}
                                </span>
                                <sc-if value="{{ n.isShut }}"><span style="display:inline-flex;align-items:center;gap:6px;color:#5B6B66;"><span aria-hidden="true" style="width:7px;height:7px;border-radius:999px;flex:0 0 auto;background:#8A9793;"></span>{{ n.pillText }}</span></sc-if><sc-if value="{{ n.isSoon }}"><span style="display:inline-flex;align-items:center;gap:6px;color:#92400E;"><span aria-hidden="true" style="width:7px;height:7px;border-radius:999px;flex:0 0 auto;background:#F59E0B;"></span>Closes soon</span></sc-if>
                              </span>
                            </span>
                          </button>
                        </sc-for>
                      </div>
                    </section>
                  </sc-if>
                  </sc-for>
            </div>
            <sc-if value="{{ mFeedMore }}">
              <div style="display:flex;justify-content:center;margin-top:30px;">
                <button type="button" onClick="{{ onMFeedMore }}" style="display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border:none;border-radius:999px;background:#F3F4F2;color:#066349;font-family:'Google Sans';font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;" style-hover="background:#E8F1ED;">
                  <i class="hgi-twotone hgi-arrow-down-01" style="font-size:16px;flex:0 0 auto;" aria-hidden="true"></i>
                  Show more
                </button>
              </div>
            </sc-if>
          </div>
        </sc-if>
