<!--
Source: Tukai Web.dc.html (design project folder), the Discover view's
'Happening soon' section (the block guarded by showExpSection).
Extracted: markup and inline values kept, scripts removed. Template tokens are left as the prototype has them.
Re-extract when the prototype changes; do not hand-edit.
-->
<sc-if value="{{ showExpSection }}">
          <div style="padding-top:26px;">
            <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
              <div style="min-width:0;">
                <h2 style="margin:0;font-family:'Google Sans';font-size:22px;font-weight:700;color:#013334;letter-spacing:-.3px;">{{ expHeading }}</h2>
                <p style="margin:5px 0 0;font-size:13.5px;color:#5B6B66;">{{ expSub }}</p>
              </div>
              <sc-if value="{{ tabAll }}">
                <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
                  <button type="button" disabled="{{ arrows.exp.backOff }}" onClick="{{ railBack }}" aria-label="Scroll experiences left" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ arrows.exp.backBc }};border-radius:999px;background:{{ arrows.exp.backBg }};display:flex;align-items:center;justify-content:center;cursor:{{ arrows.exp.backCur }};pointer-events:{{ arrows.exp.backPe }};opacity:{{ arrows.exp.backOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                    <i class="hgi-twotone hgi-arrow-left-01" style="font-size:14px;flex:0 0 auto;color:{{ arrows.exp.backFg }};" aria-hidden="true"></i>
                  </button>
                  <button type="button" disabled="{{ arrows.exp.nextOff }}" onClick="{{ railNext }}" aria-label="Scroll experiences right" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ arrows.exp.nextBc }};border-radius:999px;background:{{ arrows.exp.nextBg }};display:flex;align-items:center;justify-content:center;cursor:{{ arrows.exp.nextCur }};pointer-events:{{ arrows.exp.nextPe }};opacity:{{ arrows.exp.nextOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                    <i class="hgi-twotone hgi-arrow-right-01" style="font-size:14px;flex:0 0 auto;color:{{ arrows.exp.nextFg }};" aria-hidden="true"></i>
                  </button>
                  
                </div>
              </sc-if>
            </div>
            <sc-if value="{{ showExpRail }}">
              <div data-exp-rail="1" style="display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding:18px 2px 12px;">
                <sc-for list="{{ exps }}" as="e" hint-placeholder-count="6">
                  <div style="flex:0 0 {{ expCardW }};scroll-snap-align:start;display:flex;flex-direction:column;gap:9px;min-width:0;">
                    <div style="position:relative;">
                      <button type="button" onClick="{{ e.onOpen }}" style="display:block;width:100%;padding:0;border:none;background:#F3F4F2;border-radius:12px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;">
                        <img loading="lazy" src="{{ e.img }}" alt="{{ e.title }}" style="width:100%;height:100%;object-fit:cover;display:block;">
                      </button>
                      <button type="button" onClick="{{ e.onSave }}" aria-label="{{ e.saveLabel }}" style="position:absolute;top:0;right:0;width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                        <i class="{{ e.saveCls }}" style="font-size:21px;flex:0 0 auto;filter:drop-shadow(0 1px 3px rgba(1,51,52,.55));color:{{ e.saveTint }};" aria-hidden="true"></i>
                      </button>
                      <sc-if value="{{ e.flag }}">
                        <span style="position:absolute;top:10px;left:10px;height:26px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;">
                          <i class="hgi-twotone {{ e.flagIcon }}" style="font-size:14px;flex:0 0 auto;" aria-hidden="true"></i>
                          {{ e.flag }}
                        </span>
                      </sc-if>
                    </div>
                    <button type="button" onClick="{{ e.onOpen }}" style="border:none;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;">
                      <span style="font-size:10px;font-weight:600;color:#066349;">{{ e.host }}</span>
                      <span style="font-size:14px;font-weight:600;color:#013334;line-height:1.35;text-wrap:pretty;">{{ e.title }}</span>
                      <span style="font-size:12.5px;color:#5B6B66;">{{ e.when }}</span>
                      <span style="font-size:13px;font-weight:600;color:#1F2937;margin-top:2px;">{{ e.priceLine }}</span>
                    </button>
                  </div>
                </sc-for>
                <button type="button" onClick="{{ goExperiences }}" style="flex:0 0 {{ expCardW }};scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;align-self:flex-start;height:{{ expCardW }};border:1px solid #EDF0EE;border-radius:12px;background:#FFFFFF;cursor:pointer;" style-hover="box-shadow:0 8px 26px rgba(1,51,52,.09);" style-active="transform:scale(0.98);">
                  <span style="position:relative;width:124px;height:76px;display:flex;align-items:center;justify-content:center;">
                    <span style="position:absolute;left:0;top:12px;width:52px;height:52px;border-radius:11px;overflow:hidden;box-shadow:0 4px 12px rgba(1,51,52,.16);transform:rotate(-14deg);">
                      <img loading="lazy" src="{{ expPeekA }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
                    </span>
                    <span style="position:absolute;right:0;top:12px;width:52px;height:52px;border-radius:11px;overflow:hidden;box-shadow:0 4px 12px rgba(1,51,52,.16);transform:rotate(14deg);">
                      <img loading="lazy" src="{{ expPeekC }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
                    </span>
                    <span style="position:relative;width:60px;height:60px;border-radius:13px;overflow:hidden;box-shadow:0 6px 18px rgba(1,51,52,.22);">
                      <img loading="lazy" src="{{ expPeekB }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
                    </span>
                  </span>
                  <span style="font-family:'Google Sans';font-size:15px;font-weight:700;color:#066349;">See all</span>
                </button>
              </div>
            </sc-if>
            <sc-if value="{{ showExpGrid }}">
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-top:18px;">
              <sc-for list="{{ exps }}" as="e" hint-placeholder-count="6">
                <div style="display:flex;flex-direction:column;gap:9px;min-width:0;">
                  <div style="position:relative;">
                    <button type="button" onClick="{{ e.onOpen }}" style="display:block;width:100%;padding:0;border:none;background:#F3F4F2;border-radius:12px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;">
                      <img loading="lazy" src="{{ e.img }}" alt="{{ e.title }}" style="width:100%;height:100%;object-fit:cover;display:block;">
                    </button>
                    <button type="button" onClick="{{ e.onSave }}" aria-label="{{ e.saveLabel }}" style="position:absolute;top:0;right:0;width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                      <i class="{{ e.saveCls }}" style="font-size:21px;flex:0 0 auto;filter:drop-shadow(0 1px 3px rgba(1,51,52,.55));color:{{ e.saveTint }};" aria-hidden="true"></i>
                    </button>
                    <sc-if value="{{ e.flag }}">
                      <span style="position:absolute;top:10px;left:10px;height:26px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;">
                        <i class="hgi-twotone {{ e.flagIcon }}" style="font-size:14px;flex:0 0 auto;" aria-hidden="true"></i>
                        {{ e.flag }}
                      </span>
                    </sc-if>
                  </div>
                  <button type="button" onClick="{{ e.onOpen }}" style="border:none;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;">
                    <span style="font-size:10px;font-weight:600;color:#066349;">{{ e.host }}</span>
                    <span style="font-size:14px;font-weight:600;color:#013334;line-height:1.35;text-wrap:pretty;">{{ e.title }}</span>
                    <span style="font-size:12.5px;color:#5B6B66;">{{ e.when }}</span>
                    <span style="font-size:13px;font-weight:600;color:#1F2937;margin-top:2px;">{{ e.priceLine }}</span>
                  </button>
                </div>
              </sc-for>
            </div>
            </sc-if>
          </div>
        </sc-if>
