<!--
Source: Tukai Web.dc.html (design project folder), the Experiences view's
'Featured experiences' section (the block guarded by exHasFeat).
Extracted: markup and inline values kept, scripts removed. Template tokens are left as the prototype has them.
Re-extract when the prototype changes; do not hand-edit.
-->
<sc-if value="{{ exHasFeat }}">
            <div style="padding-top:30px;">
              <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
                <div style="min-width:0;">
                  <h2 style="margin:0;font-family:'Google Sans';font-size:22px;font-weight:700;color:#013334;letter-spacing:-.3px;">Featured experiences</h2>
                  <p style="margin:5px 0 0;font-size:13.5px;color:#5B6B66;">{{ exFeatSub }}</p>
                </div>
                <sc-if value="{{ exFeatNav.show }}">
                  <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto;">
                    <button type="button" disabled="{{ exFeatNav.backOff }}" onClick="{{ exFeatNav.back }}" aria-label="Previous featured experiences" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ exFeatNav.backBc }};border-radius:999px;background:{{ exFeatNav.backBg }};display:flex;align-items:center;justify-content:center;cursor:{{ exFeatNav.backCur }};pointer-events:{{ exFeatNav.backPe }};opacity:{{ exFeatNav.backOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                      <i class="hgi-twotone hgi-arrow-left-01" style="font-size:14px;flex:0 0 auto;color:{{ exFeatNav.backFg }};" aria-hidden="true"></i>
                    </button>
                    <button type="button" disabled="{{ exFeatNav.nextOff }}" onClick="{{ exFeatNav.next }}" aria-label="Next featured experiences" style="position:relative;width:24px;height:24px;flex:0 0 auto;border:1px solid {{ exFeatNav.nextBc }};border-radius:999px;background:{{ exFeatNav.nextBg }};display:flex;align-items:center;justify-content:center;cursor:{{ exFeatNav.nextCur }};pointer-events:{{ exFeatNav.nextPe }};opacity:{{ exFeatNav.nextOp }};transition:opacity .15s,background-color .15s;" style-before="content:'';position:absolute;inset:-10px;" style-hover="background:#D5E7DE;" style-active="transform:scale(0.96);">
                      <i class="hgi-twotone hgi-arrow-right-01" style="font-size:14px;flex:0 0 auto;color:{{ exFeatNav.nextFg }};" aria-hidden="true"></i>
                    </button>
                  </div>
                </sc-if>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:26px 16px;margin-top:18px;">
                <sc-for list="{{ exFeat }}" as="e" hint-placeholder-count="5">
                <div style="display:flex;flex-direction:column;gap:9px;min-width:0;">
                  <div style="position:relative;">
                    <button type="button" onClick="{{ e.onOpen }}" style="display:block;width:100%;padding:0;border:none;background:#F3F4F2;border-radius:12px;overflow:hidden;aspect-ratio:1/1;cursor:pointer;">
                      <img loading="lazy" src="{{ e.img }}" alt="{{ e.title }}" style="width:100%;height:100%;object-fit:cover;display:block;">
                    </button>
                    <button type="button" onClick="{{ e.onSave }}" aria-label="{{ e.saveLabel }}" style="position:absolute;top:0;right:0;width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                      <i class="{{ e.saveCls }}" style="font-size:21px;flex:0 0 auto;filter:drop-shadow(0 1px 3px rgba(1,51,52,.55));color:{{ e.saveTint }};" aria-hidden="true"></i>
                    </button>
                    <sc-if value="{{ e.flag }}">
                      <span style="position:absolute;top:10px;left:10px;height:26px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#FFFFFF;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;">
                        <i class="hgi-twotone {{ e.flagIcon }}" style="font-size:14px;flex:0 0 auto;" aria-hidden="true"></i>
                        {{ e.flag }}
                      </span>
                    </sc-if>
                  </div>
                  <button type="button" onClick="{{ e.onOpen }}" style="border:none;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;">
                    <span style="font-size: 10px; font-weight: 600; color: #066349">{{ e.host }}</span>
                    <span style="font-size:14px;font-weight:600;color:#013334;line-height:1.35;text-wrap:pretty;">{{ e.title }}</span>
                    <span style="font-size:12.5px;color:#5B6B66;">{{ e.when }}</span>
                    <span style="font-size:13px;font-weight:600;color:#1F2937;margin-top:2px;">{{ e.priceLine }}</span>
                  </button>
                </div>
              </sc-for>
              </div>
            </div>
            </sc-if>
